<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>sujay.os</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="os.css">
</head>
<body>

<!-- boot -->
<div id="boot" aria-hidden="true">
  <div class="bigmark">sujay<span class="ac">.os</span></div>
  <div class="line" data-line="0">booting kernel ............... <span class="ok">OK</span></div>
  <div class="line" data-line="1">mounting /content ........... <span class="ok">OK</span></div>
  <div class="line" data-line="2">loading personality.bin ..... <span class="ok">OK</span></div>
  <div class="line" data-line="3">waking the désign daemon .... <span class="blink">█</span></div>
  <div class="skip">click anywhere to skip</div>
</div>

<canvas id="topo"></canvas>

<div id="desk" role="application" aria-label="Sujay's desktop">
  <div id="icons"></div>
</div>

<!-- spotlight -->
<div id="spot" role="dialog" aria-label="Search">
  <div class="spot-box">
    <div class="spot-input">
      <span class="ic">⌕</span>
      <input id="spot-q" type="text" placeholder="Search apps & sections…" autocomplete="off" spellcheck="false">
    </div>
    <div class="spot-results" id="spot-results"></div>
  </div>
</div>

<div class="hint" id="hint"></div>

<div id="dock"></div>

<div id="egg-toast"></div>

<script src="../src/content.js"></script>
<script src="../src/render.js"></script>
<script src="os-app.js"></script>
</body>
</html>
